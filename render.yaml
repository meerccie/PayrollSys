databases:
  - name: payroll-db
    plan: free # change to basic-256mb+ for persistence beyond 30 days
    databaseName: payroll
    user: payroll

services:
  - type: web
    name: payroll-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: payroll-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: payroll-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: payroll-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: payroll-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: payroll-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to https://<your-app>.vercel.app
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
