services:
  postgres:
    image: postgres:17-alpine
    container_name: payroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-payroll}
      POSTGRES_USER: ${DB_USER:-payroll}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payroll}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - payroll_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payroll} -d ${DB_NAME:-payroll}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payroll_pgdata:
